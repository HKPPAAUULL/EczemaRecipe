# EczemaRecipe — local/self-hosted stack (PLAN.md §8)
# Usage: cp .env.example .env  →  fill in real credentials  →  docker compose up -d
# DB port is bound to 127.0.0.1 only; the DB is never exposed beyond localhost.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema/seed source of truth: docs/db/*.sql (read-only init scripts)
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/db/seed_categories_allergens.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      # server-side fetch target: the compose-internal API host
      API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
