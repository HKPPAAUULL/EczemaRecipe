{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block body %}
<div class="card" style="max-width:24rem;margin:3rem auto">
<h1 style="margin-bottom:0">濕疹食堂後台</h1>
<p class="muted" style="margin-top:.3rem">請輸入管理密碼登入</p>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/admin/login">
<label for="token">管理密碼（ADMIN_TOKEN）</label>
<input type="password" id="token" name="token" autocomplete="current-password" required autofocus style="width:100%">
<p><button type="submit" style="width:100%">登入</button></p>
<p class="muted" style="font-size:.85em">僅限本機／內網使用，不可經 Cloudflare Tunnel 存取。</p>
</form>
</div>
{% endblock %}
